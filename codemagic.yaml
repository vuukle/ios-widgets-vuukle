workflows:
  vuukle-sdk-tests:
    name: Vuukle SDK Crash-Fix Tests
    instance_type: mac_mini_m2
    max_build_duration: 30
    triggering:
      events:
        - pull_request
        - push
      branch_patterns:
        - pattern: 'claude/*'
          include: true
        - pattern: 'main'
          include: true
    scripts:
      - name: Resolve SPM dependencies
        script: |
          swift package resolve
      - name: Run XCTests (host)
        script: |
          swift test --parallel
    artifacts:
      - .build/**/*.xctest
